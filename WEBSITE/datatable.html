<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datatable</title>
    <script src="datatable.js" defer></script>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background-color: #fafafa;
        color: #333;
        margin: 20px;        /* ravnomjerno oko stranice, bez centrairanja */
        line-height: 1.5;
      }

      form {
        margin-bottom: 20px;
        padding: 12px 18px;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      }

      fieldset {
        border: none;
      }

      select, input[type="text"], input[type="submit"] {
        padding: 6px 10px;
        font-size: 14px;
        margin-right: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      input[type="submit"] {
        background-color: #0078d7;
        color: white;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      input[type="submit"]:hover {
        background-color: #005fa3;
      }

      /* Responsive table */
      @media (max-width: 900px) {
        table {
          font-size: 12px;
        }
        th, td {
          padding: 6px;
        }
      }

      input[type="button"], input[type="submit"] {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        margin-right: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-weight: 500;
      }

      #downloadJsonBtn {
        background-color: #2e8b57;  /* zelenkasta */
        color: white;
      }

      #downloadCsvBtn {
        background-color: #f5a623;  /* narančasta */
        color: white;
      }

      #downloadJsonBtn:hover {
        background-color: #267a4a;
      }

      #downloadCsvBtn:hover {
        background-color: #d78c17;
      }

      /* Slightly elevate buttons */
      input[type="button"]:active, input[type="submit"]:active {
        transform: scale(0.98);
      }

      /* Add gentle shadows to inputs */
      select, input[type="text"] {
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      }

      select:focus, input[type="text"]:focus {
        outline: none;
        border-color: #0078d7;
        box-shadow: 0 0 3px rgba(0,120,215,0.4);
      }

      /* Form alignment improvement */
      form fieldset {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      form div {
        font-weight: 500;
        color: #444;
      }

      /* -------------------------------- Znatno -------------------------------- */

      /* --- Table --- */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background-color: #1b1b1b;
        border: 1px solid #2a2a2a;
        box-shadow: 0 3px 8px rgba(0,0,0,0.4);
        color: #e8e6df;
      }

      th, td {
        border: 1px solid #2e2e2e;
        padding: 10px 12px;
        text-align: left;
      }

      th {
        background-color: #2a2a2a;
        color: #d4af37;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        position: sticky;
        top: 0;
        z-index: 1;
      }

      tr:nth-child(even) {
        background-color: #181818;
      }

      tr:hover {
        background-color: #222;
      }

      /* --- Text overflow cells --- */
      td.long-text,
      td.mid-text {
        max-width: 250px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
        transition: all 0.5s ease-in-out;
      }

      td.long-text:hover,
      td.mid-text:hover {
        white-space: normal;
        background-color: #252525;
      }

      /* --- Responsive --- */
      @media (max-width: 900px) {
        table { font-size: 12px; }
        th, td { padding: 6px; }
      }

      /* --- Hover indicator for large cells --- */
      td.long-text:hover::after,
      td.mid-text:hover::after {
        content: "▼";
        position: absolute;
        right: 6px;
        top: 4px;
        font-size: 10px;
        color: #d4af37;
      }
    </style>
</head>
<body>
    <form>
      <fieldset>
        <div>Pretraga:</div>
        <label><input type="text" name="search" value="" size="30"></label>
        <p><select name="atribut">
          <option value="sva_polja">Sva polja</option>
          <option value="godina">Godina</option>
          <option value="dogadaj">Događaj</option>
          <option value="lokacija">Lokacija događaj</option>
          <option value="voditelj">Voditelj</option>
          <option value="kategorija">Kategorija</option>
          <option value="opis">Opis</option>
          <option value="naziv_igre">Naziv igre</option>
          <option value="developer">Developer</option>
          <option value="izdavac">Izdavač</option>
          <option value="zemlja_podrijetla">Zemlja podrijetla</option>
          <option value="platforma">Platforma</option>
          <option value="zarn">Žarn</option>
          <option value="prosjecna_ocjena">Prosjecna ocjena (Metacritic)</option>
          <option value="pobjednik">Pobjednik</option>
          <option value="napomena">Napomena</option>
        </select><input type="submit" value="Pretraži">
          <input type="button" id="downloadJsonBtn" value="Preuzmi kao JSON!">
          <input type="button" id="downloadCsvBtn" value="Preuzmi kao CSV!"></p>
      </fieldset>
    </form>
    <table id="MyTable">
        <thead>
            <tr>
                <th>Godina</th>
                <th>Događaj</th>
                <th>Lokacija događaj</th>
                <th>Voditelj</th>
                <th>Kategorija</th>
                <th>Opis</th>
                <th>Naziv igre</th>
                <th>Developer</th>
                <th>Izdavač</th>
                <th>Zemlja podrijetla</th>
                <th>Platforma</th>
                <th>Žarn</th>
                <th>Prosjecna ocjena (Metacritic)</th>
                <th>Pobjednik</th>
                <th>Napomena</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
</body>
</html>
