<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datatable</title>
    <script src="datatable.js" defer></script>
    <!-- Styles -->
    <link rel="stylesheet" href="/public/styles_datatable.css">
</head>
<body>
    <form>
      <fieldset>
        <div>Pretraga:</div>
        <label><input type="text" name="search" value="" size="30"></label>
        <p><select name="atribut">
          <option value="sva_polja">Sva polja</option>
          <option value="godina">Godina</option>
          <option value="dogadaj">Događaj</option>
          <option value="lokacija">Lokacija događaj</option>
          <option value="voditelj">Voditelj</option>
          <option value="kategorija">Kategorija</option>
          <option value="opis">Opis</option>
          <option value="naziv_igre">Naziv igre</option>
          <option value="developer">Developer</option>
          <option value="izdavac">Izdavač</option>
          <option value="zemlja_podrijetla">Zemlja podrijetla</option>
          <option value="platforma">Platforma</option>
          <option value="zarn">Žarn</option>
          <option value="prosjecna_ocjena">Prosjecna ocjena (Metacritic)</option>
          <option value="pobjednik">Pobjednik</option>
          <option value="napomena">Napomena</option>
        </select><input type="submit" value="Pretraži">
          <input type="button" id="downloadJsonBtn" value="Preuzmi kao JSON!">
          <input type="button" id="downloadCsvBtn" value="Preuzmi kao CSV!"></p>
      </fieldset>
    </form>
    <table id="MyTable">
        <thead>
            <tr>
                <th>Godina</th>
                <th>Događaj</th>
                <th>Lokacija događaj</th>
                <th>Voditelj</th>
                <th>Kategorija</th>
                <th>Opis</th>
                <th>Naziv igre</th>
                <th>Developer</th>
                <th>Izdavač</th>
                <th>Zemlja podrijetla</th>
                <th>Platforma</th>
                <th>Žarn</th>
                <th>Prosjecna ocjena (Metacritic)</th>
                <th>Pobjednik</th>
                <th>Napomena</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
    </table>
</body>
</html>
